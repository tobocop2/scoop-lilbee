name: Validate

# Proves a hand-edited manifest still installs and runs on Windows, and that the
# install command lilbee documents still points at this bucket. The update
# workflow runs the same install check before it commits, so this covers the
# manifests that a person changes.

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check the install command lilbee documents
        # Windows ships PowerShell 5.1, which has no && operator. `shell: powershell`
        # is 5.1; `shell: pwsh` is 7 and would accept a line users cannot run.
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = 'https://raw.githubusercontent.com/tobocop2/lilbee/main/README.md'
          $readme = (Invoke-WebRequest -UseBasicParsing $url).Content
          $row = $readme -split "`n" | Select-String -Pattern '^\| \*\*Scoop\*\*' | Select-Object -First 1
          if (-not $row) { throw "no Scoop row in the lilbee README install table" }
          $cmd = [regex]::Match($row.Line, '`([^`]+)`').Groups[1].Value
          Write-Host "documented: $cmd"
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($cmd, [ref]$null, [ref]$errors)
          if ($errors) { throw "does not parse in Windows PowerShell 5.1: $($errors[0].Message)" }
          if ($cmd -notmatch 'scoop-lilbee') { throw "the documented bucket is not this repository: $cmd" }
          Write-Host "parses in Windows PowerShell $($PSVersionTable.PSVersion), and points here"

      - name: Check the CUDA gate
        # The runner has no NVIDIA card, so installing only ever proves the Vulkan
        # branch. This stubs nvidia-smi and covers the other one.
        shell: pwsh
        run: ./tools/test_cuda_gate.ps1

      - name: Read manifest version
        id: manifest
        shell: pwsh
        run: |
          $version = (Get-Content bucket/lilbee.json | ConvertFrom-Json).version
          "expected=lilbee $version" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/validate-install
        with:
          manifest-path: bucket/lilbee.json
          expected-version: ${{ steps.manifest.outputs.expected }}
